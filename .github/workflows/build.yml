name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: sdk extras
        run: echo "y" | sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: helper
        run: |
          CC=$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          mkdir -p app/src/main/assets
          $CC -static -O2 -s -o app/src/main/assets/ffhs app/src/main/jni/helper.c

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: build
        run: gradle assembleRelease --no-daemon

      - name: keystore
        run: |
          if [ ! -f ks.jks ]; then
            keytool -genkeypair -v -keystore ks.jks -storetype JKS \
              -storepass ffhs123 -keypass ffhs123 -alias ffhs \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ffhs, OU=ffhs, O=ffhs, L=ffhs, S=ffhs, C=IN"
          fi

      - name: sign
        run: |
          BT=$ANDROID_HOME/build-tools/34.0.0
          UNS=$(ls app/build/outputs/apk/release/*unsigned*.apk | head -1)
          $BT/zipalign -f 4 "$UNS" aligned.apk
          $BT/apksigner sign --ks ks.jks --ks-pass pass:ffhs123 --key-pass pass:ffhs123 --ks-key-alias ffhs --out ffhs.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ffhs-apk
          path: ffhs.apk
